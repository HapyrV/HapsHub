<div class="aemb-page">
    <div class="tab-toolbar">
        <div class="aemb-title"><span class="msi">view_in_ar</span> <span data-i18n="nav.ovrtoolkit">OVR Toolkit</span></div>
        <div class="aemb-actions">
            <select id="aemb-mode-ovrtoolkit" class="vrcn-dropdown" onchange="aembMode('ovrtoolkit')">
                <option value="child" data-i18n="hub.embed.mode_child">Inside this page</option>
                <option value="tracked" data-i18n="hub.embed.mode_tracked">Its own window over this page</option>
            </select>
            <button id="aemb-start-ovrtoolkit" class="vrcn-button-round vrcn-btn-join" onclick="aembStart('ovrtoolkit')"><span class="msi">open_in_new</span> <span data-i18n="hub.embed.open">Open here</span></button>
            <button id="aemb-release-ovrtoolkit" class="vrcn-button-round" onclick="aembRelease('ovrtoolkit')" disabled><span class="msi">close</span> <span data-i18n="hub.embed.release">Put it back</span></button>
            <button id="aemb-test-ovrtoolkit" class="vrcn-button-round" onclick="aembTest('ovrtoolkit')"><span class="msi">bug_report</span> <span data-i18n="hub.embed.test">Test</span></button>
        </div>
    </div>
    <div id="aemb-status-ovrtoolkit" class="aemb-status" role="status"></div>
    <div id="aemb-pane-ovrtoolkit" class="aemb-pane">
        <div id="aemb-hint-ovrtoolkit" class="aemb-hint" data-i18n="hub.embed.hint">Open here shows the app in this space. Put it back returns it to its own window.</div>
    </div>
    <div class="aemb-report"><div id="aemb-result-ovrtoolkit"></div><div id="aemb-results-ovrtoolkit"></div></div>
</div>
